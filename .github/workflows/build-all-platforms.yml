name: Build All Platforms (Android APK, iOS, Desktop)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  # =========================================================================
  # 1. ANDROID APK BUILD (Capacitor Android + Gradle)
  # =========================================================================
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install

      - name: Build Web Application Assets
        run: |
          npm run build

      - name: Setup Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: starches-android-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # =========================================================================
  # 2. IOS APP BUILD (Capacitor iOS + Xcode)
  # =========================================================================
  build-ios-app:
    name: Build iOS Package
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install

      - name: Build Web Application Assets
        run: |
          npm run build

      - name: Setup Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Xcode Archive (Simulator / Development)
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -destination 'generic/platform=iOS Simulator' \
                     -configuration Debug \
                     clean build \
                     CODE_SIGNING_ALLOWED=NO || true

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: starches-ios-build
          path: ios/App
          retention-days: 14

  # =========================================================================
  # 3. DESKTOP APP BUILD (Electron Builder for Linux, Windows, macOS)
  # =========================================================================
  build-desktop:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install

      - name: Build Web Frontend Assets
        run: |
          npm run build

      - name: Package Desktop Executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npx electron-builder --linux AppImage deb --publish never || true

      - name: Package Desktop Executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          npx electron-builder --win nsis --publish never || true

      - name: Package Desktop Executable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          npx electron-builder --mac dmg --publish never || true

      - name: Upload Desktop Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: starches-desktop-${{ matrix.os }}
          path: dist_electron/*
          retention-days: 14
